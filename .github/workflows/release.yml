name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=urdflint-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md "$name"/
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/urdflint.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
            echo "asset=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/urdflint "$name"/
            tar czf "$name.tar.gz" "$name"
            echo "asset=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$asset" --clobber
